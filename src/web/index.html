<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>VT420</title>
		<link rel="stylesheet" href="/src/web/style.css" />
		<script type="module" src="/src/web/main.ts"></script>
	</head>
	<body>
		<div id="monitor">
			<div id="tube">
				<canvas id="screen"></canvas>
				<div id="scanlines"></div>
				<div id="glass"></div>
			</div>
			<div id="wheels">
				<div class="wheel" id="brightness" title="Brightness: drag or turn" role="slider" aria-label="Brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35" tabindex="-1"></div>
				<div class="wheel" id="contrast" title="Contrast: drag or turn" role="slider" aria-label="Contrast" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" tabindex="-1"></div>
			</div>
			<div id="label" title="Set-Up (Ctrl+F3)">VT420</div>
		</div>
		<textarea id="keyboard" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
		<div id="notice" hidden></div>
	</body>
</html>
